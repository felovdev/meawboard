<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#6750A4">
  <title>meaw board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Холст -->
  <main id="stage" data-tool="select">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".25"/>
        </filter>
      </defs>
      <g id="world">
        <g id="layer"></g>
        <g id="overlay"></g>
      </g>
    </svg>
    <textarea id="editor" hidden spellcheck="false"></textarea>
    <div class="empty" id="empty">
      <svg viewBox="0 0 32 32" class="empty-cat"><path d="M6 12V4l7 4.5q3-.5 6 0L26 4v8q2 3 1 7-2 8-11 8T5 19q-1-4 1-7z"/></svg>
      <p>Доска пустая</p>
      <small>Двойной клик — новая заметка</small>
    </div>
  </main>

  <!-- Верхняя панель слева -->
  <header class="bar bar-left">
    <button class="icon-btn" id="btnBoards" data-tip="Мои доски" aria-label="Мои доски"><span data-icon="menu"></span></button>
    <div class="logo" title="meaw board">
      <svg viewBox="0 0 32 32">
        <path class="cat" d="M6 12V4l7 4.5q3-.5 6 0L26 4v8q2 3 1 7-2 8-11 8T5 19q-1-4 1-7z"/>
        <circle cx="12" cy="16" r="1.9" class="eye"/><circle cx="20" cy="16" r="1.9" class="eye"/>
        <path d="M14 20.4q2 1.9 4 0" class="mouth"/>
      </svg>
    </div>
    <input id="boardName" class="name" value="meaw board" maxlength="60" spellcheck="false" aria-label="Название доски">
    <span class="sync" id="sync" data-state="ok" title="Сохранено"></span>
  </header>

  <!-- Верхняя панель справа -->
  <header class="bar bar-right">
    <div class="presence" id="presence" hidden></div>
    <button class="icon-btn" id="btnUndo" data-tip="Отменить (Ctrl+Z)" aria-label="Отменить"><span data-icon="undo"></span></button>
    <button class="icon-btn" id="btnRedo" data-tip="Повторить (Ctrl+Y)" aria-label="Повторить"><span data-icon="redo"></span></button>
    <span class="vsep"></span>
    <button class="icon-btn" id="btnGrid" data-tip="Сетка" aria-label="Сетка"><span data-icon="grid"></span></button>
    <button class="icon-btn" id="btnTheme" data-tip="Тема" aria-label="Тема"><span data-icon="moon"></span></button>
    <button class="btn tonal" id="btnMenu" aria-haspopup="true"><span data-icon="download"></span><span>Файл</span></button>
    <button class="btn filled" id="btnShare"><span data-icon="share"></span><span>Поделиться</span></button>
  </header>

  <!-- Меню «Файл» -->
  <div class="menu" id="menu" hidden>
    <button class="menu-item" data-act="png"><span data-icon="image"></span>Экспорт в PNG</button>
    <button class="menu-item" data-act="svg"><span data-icon="image"></span>Экспорт в SVG</button>
    <button class="menu-item" data-act="json"><span data-icon="download"></span>Сохранить доску (.json)</button>
    <button class="menu-item" data-act="open"><span data-icon="upload"></span>Открыть доску (.json)</button>
    <div class="menu-sep"></div>
    <button class="menu-item danger" data-act="clear"><span data-icon="trash"></span>Очистить доску</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <!-- Инструменты -->
  <nav class="toolbar" id="toolbar" aria-label="Инструменты"></nav>

  <!-- Свойства выбранного -->
  <div class="props" id="props" hidden></div>

  <!-- Масштаб -->
  <div class="zoom">
    <button class="icon-btn sm" id="zoomOut" data-tip="Уменьшить (−)" aria-label="Уменьшить"><span data-icon="minus"></span></button>
    <button class="zoom-label" id="zoomLabel" data-tip="Сбросить до 100%">100%</button>
    <button class="icon-btn sm" id="zoomIn" data-tip="Увеличить (+)" aria-label="Увеличить"><span data-icon="plus"></span></button>
    <span class="vsep"></span>
    <button class="icon-btn sm" id="zoomFit" data-tip="Показать всё (0)" aria-label="Показать всё"><span data-icon="fit"></span></button>
  </div>

  <div class="cursors" id="cursors"></div>

  <!-- Меню досок и аккаунт -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-label="Мои доски"></aside>

  <div class="snackbar" id="snack" role="status"></div>

  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
